name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-paper.txt
      - run: pip install -r requirements-paper.txt
      - run: python -m pytest tests/test_exterminator.py tests/test_variable_pulse.py tests/test_neural.py -q
        env:
          OPENBLAS_NUM_THREADS: '1'
